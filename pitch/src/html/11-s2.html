<!-- CENA 2 · Halor e a Bia · o logotipo desce pendurado numa viga de luz; a Bia entra pela esquerda em "Bia" -->
<section class="scene s2" id="s2" data-world="paper">
  <!-- viga de luz com gancho e fios: desce, segura as letras e vai embora depois de "Halor!" -->
  <div class="kx s2-beamwrap" style="--out: calc(var(--w-halor) + 1300); --xdur: 700; left: 0; top: 0">
    <i class="s2-rail k fade" style="--in: 0; --dur: 400"></i>
    <div class="s2-beam k down" style="--in: 100; --dur: 700; left: 520px; top: 150px"><i class="s2-hook"></i></div>
    <div class="s2-strings" style="--stag: 110">
      <i class="s2-str k grow-y" style="--in: 700; --i: 0; left: 664px; top: 184px; height: 120px"></i>
      <i class="s2-str k grow-y" style="--in: 700; --i: 1; left: 790px; top: 184px; height: 150px"></i>
      <i class="s2-str k grow-y" style="--in: 700; --i: 2; left: 880px; top: 184px; height: 120px"></i>
      <i class="s2-str k grow-y" style="--in: 700; --i: 3; left: 975px; top: 184px; height: 150px"></i>
      <i class="s2-str k grow-y" style="--in: 700; --i: 4; left: 1080px; top: 184px; height: 150px"></i>
      <i class="s2-str k grow-y" style="--in: 700; --i: 5; left: 1225px; top: 184px; height: 130px"></i>
    </div>
  </div>
  <h1 class="s2-word" style="left: 600px; top: 290px; --stag: 130">
    <span class="k s2-hang" style="--in: 900; --i: 0; --dur: 1100">h</span><span class="k s2-hang" style="--in: 900; --i: 1; --dur: 1100">a</span><span class="k s2-hang" style="--in: 900; --i: 2; --dur: 1100">l</span><span class="k s2-hang" style="--in: 900; --i: 3; --dur: 1100">o</span><span class="k s2-hang" style="--in: 900; --i: 4; --dur: 1100">r</span>
  </h1>
  <svg class="s2-mk k s2-hang" style="--in: 1550; --dur: 1100; left: 1150px; top: 300px" viewBox="0 0 64 64" aria-hidden="true"><use href="#hl-mark-paper"/></svg>
  <!-- em "Halor!": estalo de luz e faíscas -->
  <i class="ring k ring-x" style="--in: var(--w-halor); --dur: 900; left: 930px; top: 400px"></i>
  <svg class="spark k pop" style="--in: var(--w-halor); left: 1310px; top: 250px" viewBox="0 0 24 24"><use class="l twinkle" href="#i-spark"/></svg>
  <svg class="spark k pop" style="--in: calc(var(--w-halor) + 200); left: 556px; top: 430px; width: 28px; height: 28px" viewBox="0 0 24 24"><use class="l twinkle" href="#i-spark"/></svg>
  <p class="s2-sub k fade" style="--in: calc(var(--w-halor) + 500); left: 606px; top: 530px">Apresentações vivas em <em>HTML</em></p>
  <i class="s2-line k grow-x" style="--in: calc(var(--w-halor) + 700); --dur: 700; left: 606px; top: 584px"></i>

  <!-- a Bia entra pela esquerda, acena, se apresenta -->
  <div class="k walk-in-l" style="--in: calc(var(--w-bia) - 250); --dur: 650; left: 330px; top: 960px">
    <div class="bia" data-pose="walk" data-face="happy" data-props="tablet" data-keys="@bia+300:pose=idle,face=happy;@bia+900:pose=wave,face=laugh;@nossa:pose=present,face=proud;@inteligencia:pose=look-up,face=wow;@artificial+400:pose=bow,face=wink;@artificial+1100:pose=idle,face=happy" style="--x: 0px; --y: 0px; --s: 1.1"></div>
  </div>
  <i class="s2-bia-ring k fade" style="--in: calc(var(--w-bia) + 300); --dur: 500; left: 330px; top: 790px"></i>
  <div class="tag-pill paper k pop-c" style="--in: calc(var(--w-bia) + 200); --dur: 450; left: 330px; top: 520px"><i><svg><use href="#i-spark"/></svg></i>Bia · IA do Halor</div>
</section>
