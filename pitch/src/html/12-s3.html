<!-- CENA 3 · Slide vivo · noite -->
<section class="scene s3" id="s3">
  <!-- pilha de slides cinzas (cai em "empilha", some em "muito mais") -->
  <div class="kx x-left s3-pile" style="--out: 2700; --xdur: 500; left: 170px; top: 420px; --stag: 520">
    <div class="slide dull k drop" style="--in: 100; --i: 0; --dur: 700; left: 0; top: 240px; width: 420px; transform: rotate(-4deg)"><p class="sl-t">Resultados</p><ul><li>Tópico um</li><li>Tópico dois</li><li>Tópico três</li></ul></div>
    <div class="slide dull k drop" style="--in: 100; --i: 1; --dur: 700; left: 40px; top: 150px; width: 420px"><p class="sl-t">Agenda</p><ul><li>Item</li><li>Item</li><li>Item</li></ul></div>
    <div class="slide dull k drop" style="--in: 100; --i: 2; --dur: 700; left: 10px; top: 60px; width: 420px; transform: rotate(3deg)"><p class="sl-t">Resumo</p><ul><li>Ponto</li><li>Ponto</li><li>Ponto</li></ul></div>
  </div>
  <!-- o sopro: partículas voam para a direita -->
  <div class="s3-burst" style="left: 480px; top: 560px; --stag: 40">
    <i class="k s3-fly" style="--in: 2650; --i: 0; --dx: 180px; --dy: -220px"></i><i class="k s3-fly" style="--in: 2650; --i: 1; --dx: 300px; --dy: -120px"></i>
    <i class="k s3-fly" style="--in: 2650; --i: 2; --dx: 260px; --dy: 60px"></i><i class="k s3-fly" style="--in: 2650; --i: 3; --dx: 340px; --dy: 140px"></i>
    <i class="k s3-fly" style="--in: 2650; --i: 4; --dx: 160px; --dy: -320px"></i><i class="k s3-fly" style="--in: 2650; --i: 5; --dx: 220px; --dy: 240px"></i>
    <i class="k s3-fly" style="--in: 2650; --i: 6; --dx: 380px; --dy: -40px"></i><i class="k s3-fly" style="--in: 2650; --i: 7; --dx: 120px; --dy: 120px"></i>
  </div>

  <!-- a Bia, entre a pilha e o slide -->
  <div class="bia" data-pose="idle" data-face="oops" data-props="stamp" data-keys="500:face=oops,pose=think;2600:pose=present,face=wow,dur=250;3900:pose=point-right,face=happy;8900:face=wow;10100:pose=stamp,face=proud;10500:pose=stamp-down,dur=140;11000:pose=idle,face=proud" style="--x: 760px; --y: 935px; --s: 1"></div>

  <!-- faixa de inserção em miniatura (caixa de luz com o símbolo) -->
  <div class="s3-kit k pop" style="--in: 3800; --dur: 600; left: 520px; top: 790px">
    <i class="s3-kit-glow l pulse"></i>
    <svg class="s3-kit-mk" viewBox="0 0 64 64"><use href="#hl-mark"/></svg>
    <span class="mono">faixa de inserção</span>
  </div>

  <!-- quatro fichas voam da caixa para o slide, uma por palavra: ideia, imagem, movimento, interação -->
  <div class="s3-chips" style="left: 580px; top: 800px; --stag: 790">
    <div class="fich k s3-arc" style="--in: 4200; --i: 0; --dur: 1300"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg></i>Ideia</div>
    <div class="fich k s3-arc" style="--in: 4200; --i: 1; --dur: 1300"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 16l5-5 4 4 2.5-2.5 5.5 5.5"/><circle cx="16" cy="9" r="1.6" fill="currentColor" stroke="none"/></svg></i>Imagem</div>
    <div class="fich k s3-arc" style="--in: 4200; --i: 2; --dur: 1300"><i><svg viewBox="0 0 24 24"><use href="#i-play"/></svg></i>Movimento</div>
    <div class="fich k s3-arc" style="--in: 4200; --i: 3; --dur: 1300"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19V13M10 19V6M15 19v-9M20 19v-4"/></svg></i>Interação</div>
  </div>

  <!-- o slide vivo flutua à direita, sobre um pedestal de luz; acende em "experiências" -->
  <div class="s3-stage k up" style="--in: 3300; --dur: 700; left: 1120px; top: 250px">
    <i class="pedestal"></i>
    <div class="slide live s3-live" style="position: relative; width: 640px">
      <span class="sl-glow k fade" style="--in: 8300; --dur: 900"></span>
      <p class="sl-k k fade" style="--in: 8200">Kickoff 2027</p>
      <p class="sl-t k type" style="--in: 8500; --dur: 700">Plano em <em>12 semanas</em></p>
      <div class="sl-bars" style="--stag: 140"><i class="k grow-y" style="--v:.42; --in: 8900; --i: 0"></i><i class="k grow-y" style="--v:.58; --in: 8900; --i: 1"></i><i class="k grow-y" style="--v:.74; --in: 8900; --i: 2"></i><i class="hot k grow-y" style="--v:.94; --in: 8900; --i: 3"></i></div>
      <div class="sl-vote k fade" style="--in: 9500; --stag: 160">
        <div><span>Produto</span><i><b class="k grow-x" style="--v:.62; --in: 9600; --i: 0; --dur: 700"></b></i><b>62 %</b></div>
        <div><span>Design</span><i><b class="k grow-x" style="--v:.28; --in: 9600; --i: 1; --dur: 700"></b></i><b>28 %</b></div>
      </div>
      <span class="s3-check k pop" style="--in: 10500; --dur: 420"><svg><use href="#i-check"/></svg></span>
      <i class="s3-wave k s3-ring" style="--in: 10500; --dur: 900"></i>
    </div>
    <p class="pill solid k pop" style="--in: 10850; position: absolute; right: -20px; top: -30px">87 % da sala votou</p>
  </div>
</section>
