<!-- CENA 6 · Onde o olhar ficou · noite -->
<section class="scene s6" id="s6">
  <!-- notebook que fecha em "termina" -->
  <div class="s6-laptop k up" style="--in: 100; left: 250px; top: 300px">
    <div class="s6-lid k s6-close" style="--in: 900; --dur: 1300">
      <div class="s6-screen">
        <div class="slide live" style="left: 18px; top: 16px; width: 460px; padding: 26px 30px">
          <span class="sl-glow"></span><p class="sl-k">Kickoff 2027</p><p class="sl-t" style="font-size: 30px">Plano em <em>12 semanas</em></p>
          <div class="sl-bars" style="height: 80px"><i style="--v:.42"></i><i style="--v:.58"></i><i style="--v:.74"></i><i class="hot" style="--v:.94"></i></div>
        </div>
      </div>
    </div>
    <div class="s6-base"></div>
  </div>
  <p class="s6-off mono k fade" style="--in: 2000; left: 340px; top: 660px">reunião encerrada</p>

  <!-- celular acende e vibra em "continua" -->
  <div class="s6-phone k pop" style="--in: 2300; left: 820px; top: 330px">
    <div class="k shake" style="--in: 2700; --dur: 600; position: absolute; inset: 0">
      <div class="s6-pscreen k fade" style="--in: 3100; --dur: 500">
        <p class="sl-k">Kickoff 2027</p><p class="s6-mini-t">Plano em <em>12 semanas</em></p>
        <div class="sl-bars" style="height: 70px"><i style="--v:.42"></i><i style="--v:.58"></i><i style="--v:.74"></i><i class="hot l pulse" style="--v:.94"></i></div>
      </div>
    </div>
  </div>
  <div class="pill k pop s6-link" style="--in: 3600; left: 760px; top: 250px"><svg style="width:20px;height:20px"><use href="#i-link"/></svg>halor.app/kickoff-2027</div>

  <!-- Painel Halor em "Painel Halor": onde o olhar ficou -->
  <div class="s6-panel k right" style="--in: 5500; --dur: 700; left: 1100px; top: 190px">
    <p class="mono s6-ph">Painel Halor</p>
    <p class="s6-title">Onde o olhar ficou</p>
    <div class="s6-bars" style="--stag: 110"><i class="k grow-y" style="--v:.35; --in: 6000; --i: 0"></i><i class="k grow-y" style="--v:.5; --in: 6000; --i: 1"></i><i class="hot k grow-y" style="--v:.95; --in: 6000; --i: 2"><b>41 s</b></i><i class="k grow-y" style="--v:.6; --in: 6000; --i: 3"></i><i class="k grow-y" style="--v:.45; --in: 6000; --i: 4"></i><i class="k grow-y" style="--v:.3; --in: 6000; --i: 5"></i></div>
    <p class="mono s6-axis">slide 1 · 2 · <b>3</b> · 4 · 5 · 6</p>
    <div class="s6-idx k fade" style="--in: 6800"><span class="mono">Índice Halor</span><b><span class="num-n k counter" style="--n0: 0; --n1: 84; --in: 6800; --dur: 900"></span></b></div>
    <p class="mono s6-foot">link halor medido</p>
  </div>
  <div class="s6-toast k up" style="--in: 7340; left: 1000px; top: 720px"><i></i><span><b>Lia</b> abriu seu link</span><em class="mono">41 s no slide 3</em></div>

  <div class="bia" data-pose="idle" data-face="sleepy" data-props="clipboard" data-keys="2300:face=wow,pose=point-right,dur=200;4400:pose=present,face=happy;7400:face=proud,pose=idle" style="--x: 640px; --y: 960px; --s: .95"></div>
</section>
