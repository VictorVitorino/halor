<!-- CENA 5 · Da faísca ao valor que fica · noite -->
<section class="scene s5" id="s5">
  <!-- trilho e postes -->
  <div class="rail k grow-x" style="--in: 0; --dur: 900; top: 770px; left: 0; right: 0"></div>
  <div class="s5-stations" style="left: 0; top: 0; --stag: 180">
    <div class="s5-st k down" style="--in: 300; --i: 0; left: 75px">
      <i class="post" style="left: 158px; top: 190px; height: 390px"></i>
      <div class="station">
        <span class="st-on k fade" style="--in: 1420; --dur: 500"></span>
        <span class="st-n">1</span>
        <span class="st-ic k s5-lit" style="--in: 1420"><svg viewBox="0 0 64 64"><path class="k spin-in" style="--in: 1420; --dur: 500" d="M32 6Q32 32 58 32Q32 32 32 58Q32 32 6 32Q32 32 32 6Z" fill="currentColor"/></svg></span>
        <span class="st-t k s5-lit" style="--in: 1420">Faísca</span>
      </div>
    </div>
    <div class="s5-st k down" style="--in: 300; --i: 1; left: 515px">
      <i class="post" style="left: 158px; top: 190px; height: 390px"></i>
      <div class="station">
        <span class="st-on k fade" style="--in: 3500; --dur: 500"></span>
        <span class="st-n">2</span>
        <span class="st-ic k s5-lit" style="--in: 3500"><svg viewBox="0 0 64 64"><path class="k draw" style="--in: 3500; --dur: 800" pathLength="1" d="M55.56 21.01A26 26 0 1 1 42.99 8.44" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg></span>
        <span class="st-t k s5-lit" style="--in: 3500">Atenção</span>
      </div>
    </div>
    <div class="s5-st k down" style="--in: 300; --i: 2; left: 955px">
      <i class="post" style="left: 158px; top: 190px; height: 390px"></i>
      <div class="station">
        <span class="st-on k fade" style="--in: 5660; --dur: 500"></span>
        <span class="st-n">3</span>
        <span class="st-ic k s5-lit" style="--in: 5660"><svg viewBox="0 0 64 64"><circle class="k draw" style="--in: 5660; --dur: 800" pathLength="1" cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="3.5"/></svg></span>
        <span class="st-t k s5-lit" style="--in: 5660">Confiança</span>
      </div>
    </div>
    <div class="s5-st k down" style="--in: 300; --i: 3; left: 1395px">
      <i class="post" style="left: 158px; top: 190px; height: 390px"></i>
      <div class="station">
        <span class="st-on k fade" style="--in: 8620; --dur: 500"></span>
        <span class="st-n">4</span>
        <span class="st-ic k s5-lit" style="--in: 8620"><svg viewBox="0 0 64 64"><circle class="k pop" style="--in: 8620; --dur: 500" cx="32" cy="32" r="12" fill="currentColor"/></svg></span>
        <span class="st-t k s5-lit" style="--in: 8620">Valor<small class="mono">que fica</small></span>
      </div>
    </div>
  </div>
  <!-- estalos de luz a cada estação -->
  <i class="s5-ring k" style="--in: 1420; --dur: 900; left: 240px; top: 390px"></i>
  <i class="s5-ring k" style="--in: 3500; --dur: 900; left: 680px; top: 390px"></i>
  <i class="s5-ring k" style="--in: 5660; --dur: 900; left: 1120px; top: 390px"></i>
  <i class="s5-ring k" style="--in: 8620; --dur: 900; left: 1560px; top: 390px"></i>

  <!-- o slide feliz viaja pelo trilho -->
  <div class="k s5-ride" style="--in: 400; --dur: 10000; left: 0; top: 590px">
    <div class="slide live s5-slide" style="left: 0; top: 0; width: 300px">
      <span class="sl-glow"></span>
      <p class="sl-k">Kickoff</p>
      <div class="sl-bars" style="height: 60px"><i style="--v:.5"></i><i style="--v:.7"></i><i class="hot" style="--v:.95"></i></div>
      <svg class="sl-face" style="width: 64px; height: 42px; right: 16px; top: 14px" viewBox="0 0 92 60" aria-hidden="true">
        <ellipse cx="26" cy="22" rx="14" ry="16" fill="#fff"/><ellipse cx="66" cy="22" rx="14" ry="16" fill="#fff"/>
        <circle cx="29" cy="24" r="6.5" fill="#2a1f4d"/><circle cx="69" cy="24" r="6.5" fill="#2a1f4d"/>
        <path d="M32 46q14 14 28 0" fill="none" stroke="#f4eeff" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span class="s3-check k pop" style="--in: 10000; --dur: 420; right: 14px; bottom: 14px"><svg><use href="#i-check"/></svg></span>
    </div>
  </div>

  <!-- o símbolo completo nasce acima do trilho, com o vão aberto -->
  <div class="s5-mark k pop" style="--in: 9000; --dur: 700; left: 860px; top: 40px">
    <svg viewBox="0 0 64 64" class="l pulse"><use href="#hl-mark"/></svg>
  </div>
  <div class="s5-confetti" style="left: 960px; top: 150px; --stag: 30">
    <i class="k s3-fly" style="--in: 9000; --i: 0; --dx: -260px; --dy: -90px"></i><i class="k s3-fly" style="--in: 9000; --i: 1; --dx: 280px; --dy: -70px"></i>
    <i class="k s3-fly" style="--in: 9000; --i: 2; --dx: -180px; --dy: 180px"></i><i class="k s3-fly" style="--in: 9000; --i: 3; --dx: 220px; --dy: 160px"></i>
    <i class="k s3-fly" style="--in: 9000; --i: 4; --dx: -340px; --dy: 40px"></i><i class="k s3-fly" style="--in: 9000; --i: 5; --dx: 360px; --dy: 60px"></i>
    <i class="k s3-fly" style="--in: 9000; --i: 6; --dx: -80px; --dy: 240px"></i><i class="k s3-fly" style="--in: 9000; --i: 7; --dx: 100px; --dy: -140px"></i>
    <i class="k s3-fly" style="--in: 9000; --i: 8; --dx: -420px; --dy: 120px"></i><i class="k s3-fly" style="--in: 9000; --i: 9; --dx: 440px; --dy: -20px"></i>
  </div>

  <!-- a Bia acompanha o slide e carimba no fim -->
  <div class="bia" data-pose="walk" data-face="happy" data-props="stamp" data-keys="0:x=180,dur=1;400:x=1480,dur=10000,ease=linear,pose=walk;1420:face=wow,dur=200;2800:face=happy;5700:face=proud;8620:face=wow;9600:pose=stamp,face=proud;10000:pose=stamp-down,dur=140;10500:pose=cheer,face=proud" style="--x: 180px; --y: 965px; --s: .9"></div>
</section>
