<!-- CENA 1 · Da proposta ao negócio · abre no escuro com o Campo Halor; a luz abre em círculo e revela o mundo lavanda -->
<section class="scene s1" id="s1" data-world="paper" data-world-from="night" data-world-at="2600" data-world-cx="960" data-world-cy="560" data-field="1" data-field-until="2800" data-field-entrance="1">

  <!-- trilha, moeda "?", muro e a porta NEGÓCIO -->

    <i class="s1-door-halo k fade" style="--in: var(--w-negocio); --dur: 600"></i>
  </div>

  <!-- a Proposta: nasce em "oportunidade", ganha carinha e pezinhos em "O difícil" e caminha até a porta -->

        <svg class="df k fade" style="--in: var(--w-o); --dur: 300" viewBox="0 0 120 70" aria-hidden="true">
          <ellipse cx="34" cy="26" rx="13" ry="15" fill="#fff" stroke="#17112b" stroke-width="3"/><ellipse cx="86" cy="26" rx="13" ry="15" fill="#fff" stroke="#17112b" stroke-width="3"/>
