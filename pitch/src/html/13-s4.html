<!-- CENA 4 · Personagens · a Bia pula para dentro do slide; ela e o cliente apontam, comemoram e conduzem -->
<section class="scene s4" id="s4" data-world="night">
  <div class="studio dark-frame k zoom" style="--in: 0; --dur: 600; left: 300px; top: 160px">
    <div class="su-top"><svg class="mk"><use href="#hl-mark-paper"/></svg><span class="su-doc">Resultados do T3</span><span class="su-saved">Salvo</span><span class="su-go">Apresentar</span></div>
    <div class="su-rib"><span>Texto</span><span>Formas</span><span>Imagem</span><span>Gráficos</span><span>Cards</span><span class="k rib-on" style="--in: var(--w-personagens)">Personagens</span><span><svg><use href="#i-wand"/></svg>Efeitos</span></div>
    <div class="su-body">
      <div class="su-rail"><i></i><i></i><i class="on"></i><i></i><i></i></div>
      <div class="su-canvas">
        <div class="ch-slide">
          <p class="ed-k">Resultados</p>
          <p class="t">O T3 em um gráfico</p>
          <div class="bars"><i style="--v:.42"></i><i style="--v:.6"></i><i class="hot" style="--v:.95"></i><i style="--v:.7"></i></div>
        </div>
      </div>
      <div class="su-insp ch-panel">
        <p class="in-h">Personagens</p>
        <div class="ch-card k pop" style="--in: var(--w-personagens)">
          <div class="bia" data-pose="wave" data-face="happy" data-props="" style="--x: 120px; --y: 138px; --s: .38"></div>
          <span>Bia</span><small>guia</small>
          <i class="on k fade" style="--in: var(--w-bia); --dur: 250"></i>
        </div>
        <div class="ch-card k pop" style="--in: calc(var(--w-personagens) + 150)">
          <div class="bia" data-skin="cliente" data-pose="idle" data-face="happy" data-props="" style="--x: 120px; --y: 138px; --s: .36"></div>
          <span>Cliente</span><small>plateia</small>
          <i class="on k fade" style="--in: var(--w-eles); --dur: 250"></i>
        </div>
        <div class="ch-poses k fade" style="--in: var(--w-vivem)"><i>apontar</i><i>comemorar</i><i>conduzir</i><i>acenar</i><i>pensar</i></div>
      </div>
    </div>
  </div>

  <!-- a Bia voa do painel para dentro do slide -->
  <div class="k s4-fly" style="--in: calc(var(--w-bia) + 100); --dur: 900; --dx: 770px; --dy: -300px; left: 690px; top: 772px">
    <div class="k sway-x" style="--in: var(--w-conduzem); --dur: 1000; --dx: 70px">
      <div class="bia" data-pose="wave" data-face="laugh" data-props="" data-keys="@apontam:pose=point-right,face=wow;@comemoram:pose=celebrate,face=laugh;@conduzem:pose=walk,face=happy;@plateia:pose=wave,face=happy;@voce:pose=bow,face=proud" style="--x: 0px; --y: 0px; --s: .5"></div>
    </div>
  </div>
  <div class="k pop" style="--in: var(--w-eles); --dur: 500; left: 1150px; top: 772px">
    <div class="bia" data-skin="cliente" data-pose="idle" data-face="happy" data-props="" data-keys="@apontam:pose=look-up,face=wow;@comemoram:pose=jump,face=laugh;@conduzem:pose=hands-hips,face=happy;@voce:pose=celebrate,face=laugh" style="--x: 0px; --y: 0px; --s: .46"></div>
  </div>
  <i class="ring k ring-x" style="--in: calc(var(--w-bia) + 950); --dur: 800; left: 690px; top: 700px"></i>
  <svg class="spark k pop" style="--in: var(--w-comemoram); left: 640px; top: 560px" viewBox="0 0 24 24"><use class="l twinkle" href="#i-spark"/></svg>
  <svg class="spark k pop" style="--in: calc(var(--w-comemoram) + 200); left: 1190px; top: 580px; width: 30px; height: 30px" viewBox="0 0 24 24"><use class="l twinkle" href="#i-spark"/></svg>

  <div class="tag-pill paper k pop-c" style="--in: var(--w-bia); left: 150px; top: 610px"><i><svg><use href="#i-spark"/></svg></i>Bia · guia do Halor</div>
  <div class="bia" data-pose="idle" data-face="happy" data-props="clicker" data-keys="@personagens:pose=present,face=happy;@bia:pose=jump,face=laugh;@bia+700:pose=point-right,face=happy;@comemoram:pose=celebrate,face=laugh;@voce:pose=idle,face=proud" style="--x: 150px; --y: 968px; --s: .8"></div>
</section>
