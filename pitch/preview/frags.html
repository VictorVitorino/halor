<!-- ==========================================================================
     PITCH HALOR · fragmentos de props com partes animáveis (templates frag-*)
     Cada template (id frag-NOME) traz um SVG inline, pronto para colar na cena (requer os defs de src/html/02-props.html:
     gradientes pg-*, filtros pf-*). Partes recebem classes e variáveis (--v, --ex, --ey, --lid, --i) já ligadas por
     `style` inline (transform-box: fill-box), então NÃO precisam de CSS extra: basta o diretor de arte definir as variáveis
     ou pôr classes .k/.l nos grupos. Nenhum frag tem `animation`/`transition` próprios. O comentário acima de cada
     template documenta as classes. Cada frag tem overflow:visible e tamanho natural no `style` (ajuste width/height à vontade).
     ========================================================================== -->
<!-- frag:eye · par de olhos · .eye (--i) › .iris (--ex,--ey em -1..1) · .lid (--lid 0..1 fecha de cima) · --p-lid = cor da pálpebra (fundo) -->
<template id="frag-eye">
<svg class="frag eyes" viewBox="0 0 120 64" style="width:120px;height:64px;overflow:visible">
<g class="eye" style="--i:0">
  <ellipse cx="30" cy="32" rx="22" ry="27" fill="#ffffff"/>
  <g class="iris" style="transform:translate(calc(var(--ex,0) * 11px), calc(var(--ey,0) * 11px))">
    <circle cx="30" cy="34" r="11.0" fill="url(#pg-iris)"/><circle cx="34" cy="30" r="3.5" fill="#ffffff"/>
  </g>
  <ellipse class="lid" cx="30" cy="32" rx="23" ry="28" fill="var(--p-lid, #07040f)" style="transform:scaleY(var(--lid,0));transform-origin:50% 0;transform-box:fill-box"/>
</g>
<g class="eye" style="--i:1">
  <ellipse cx="90" cy="32" rx="22" ry="27" fill="#ffffff"/>
  <g class="iris" style="transform:translate(calc(var(--ex,0) * 11px), calc(var(--ey,0) * 11px))">
    <circle cx="90" cy="34" r="11.0" fill="url(#pg-iris)"/><circle cx="94" cy="30" r="3.5" fill="#ffffff"/>
  </g>
  <ellipse class="lid" cx="90" cy="32" rx="23" ry="28" fill="var(--p-lid, #07040f)" style="transform:scaleY(var(--lid,0));transform-origin:50% 0;transform-box:fill-box"/>
</g>
</svg>
</template>
